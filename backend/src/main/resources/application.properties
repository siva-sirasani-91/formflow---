server.port=${SERVER_PORT:8080}

# MySQL 8 Database Connection (local or cloud MySQL such as Enzonic)
# Provide values via environment variables; do not commit credentials.
# For cloud MySQL requiring TLS/SSL, include ?sslMode=REQUIRED (or ?useSSL=true&requireSSL=true) in DB_URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (tuned for cloud & local MySQL reliability)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.data-source-properties.useUnicode=true
spring.datasource.hikari.data-source-properties.characterEncoding=utf8

# JPA / Hibernate (use JPA_DDL_AUTO=validate in strict production after running schema.sql)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Consistent JSON error details for API clients
server.error.include-message=always

# JWT Signing Secret (provide a 32+ character cryptographically random secret via JWT_SECRET)
app.jwt.secret=${JWT_SECRET}

# Allowed CORS origins (comma-separated, non-wildcard)
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
