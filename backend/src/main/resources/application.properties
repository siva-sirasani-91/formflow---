server.port=${PORT:8080}

# MySQL Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/formflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret
app.jwt.secret=${JWT_SECRET:formflow-local-development-secret-change-before-production}

# CORS
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}




